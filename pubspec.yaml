name: fiscogest_rd
description: Plataforma Empresarial Modular - FiscoGest RD 3.0
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ ESTADO Y NAVEGACIÓN (OFICIALES: Riverpod + GoRouter)
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # ✅ BASE DE DATOS (OFICIAL: Drift; ELIMINADO sqflite PROHIBIDO)
  drift: ^2.20.0
  path_provider: ^2.1.4
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.27

  # ✅ UTILIDADES
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.5.0
  http: ^1.2.2
  html: ^0.15.4

  # ✅ INMUTABILIDAD Y SERIALIZACIÓN (OFICIALES: Freezed + Json Serializable)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ✅ GENERADORES DE CÓDIGO
  build_runner: ^2.4.14
  json_serializable: ^6.9.2
  drift_dev: ^2.20.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo_fiscogest.png