name: fiscogest_rd
description: Plataforma Empresarial Modular - FiscoGest RD 3.0
publish_to: 'none'
version: 3.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0
  go_router: ^14.6.2
  drift: ^2.21.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.28
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  http: ^1.6.0
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image_picker: ^1.2.3
  mobile_scanner: ^6.0.2
  file_picker: ^10.3.7
  xml: ^6.5.0
  asn1lib: ^1.5.0
  pointycastle: ^3.9.1
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.1
  open_filex: ^5.0.0
  permission_handler: ^13.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.3
  drift_dev: ^2.21.0
  freezed: ^2.5.8
  riverpod_generator: ^2.5.1
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/ecf_xsd/
    - assets/branding/app_icon.png

# Iconos adaptativos (Android) + iOS/desktop/web
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  # Adaptive Android (cualquier forma de launcher)
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  linux:
    generate: true
    image_path: "assets/branding/app_icon.png"
