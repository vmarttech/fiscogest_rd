name: fiscogest_rd
description: Plataforma Empresarial Modular - FiscoGest RD 3.0
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ✅ GESTIÓN DE ESTADO Y NAVEGACIÓN (OFICIALES)
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0
  go_router: ^14.6.2

  # ✅ BASE DE DATOS (DRIFT - SQL moderno y seguro)
  drift: ^2.21.0
  path_provider: ^2.1.6
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.28

  # ✅ UTILIDADES
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  http: ^1.3.0
  share_plus: ^10.1.1

  # ✅ INMUTABILIDAD Y SERIALIZACIÓN
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ✅ CALIDAD DE CÓDIGO
  flutter_lints: ^5.0.0

  # ✅ GENERADORES DE CÓDIGO
  build_runner: ^2.4.15
  json_serializable: ^6.9.3
  drift_dev: ^2.21.0
  freezed: ^2.5.8
  riverpod_generator: ^2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_fiscogest.png
