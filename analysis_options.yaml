include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    undefined_class: error
    undefined_method: error
    undefined_identifier: error
    undefined_enum_constant: error
    undefined_getter: error
    undefined_setter: error
    missing_required_param: error
    argument_type_not_assignable: error
    invalid_assignment: error
    return_of_invalid_type: error
    mixin_of_non_class: error
    const_with_non_const: error
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    dead_code: error
    null_check_on_nullable_type_parameter: error
    unnecessary_null_checks: warning
    null_closures: warning
    avoid_print: warning
    deprecated_member_use: warning
    duplicate_import: error
    uri_has_not_been_generated: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/generated/**"
    - "**/*.bak"
    - "**/schema/**"

linter:
  rules:
    - avoid_print
    - always_declare_return_types
    - always_use_package_imports
    - annotate_overrides
    - avoid_empty_else
    - avoid_unnecessary_containers
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - constant_identifier_names
    - depend_on_referenced_packages
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_in_if_null_operators
    - prefer_const_declarations
    - avoid_dynamic_calls
    - no_logic_in_create_state
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_build_context_synchronously
    - use_key_in_widget_constructors
    - secure_pubspec_urls
    - no_leading_underscores_for_library_prefixes
    - no_leading_underscores_for_local_identifiers
    - library_private_types_in_public_api
    - implicit_call_tearoffs
    - unnecessary_library_directive
    - eol_at_end_of_file
