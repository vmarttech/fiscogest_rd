# ✅ Reglas base recomendadas por Flutter
include: package:flutter_lints/flutter.yaml

# ==============================================
# ✅ CONFIGURACIÓN DE DART CODE METRICS
# ==============================================
dart_code_metrics:
  # Límites de complejidad y tamaño
  metrics:
    cyclomatic-complexity: 15       # Complejidad máxima permitida
    maximum-nesting-level: 4        # Niveles de anidación máximos
    number-of-parameters: 6         # Cantidad máxima de parámetros por método
    source-lines-of-code: 250       # Líneas máximas por método/clase

  # Reglas de calidad de código
  rules:
    - avoid-unused-parameters
    - avoid-unnecessary-type-casts
    - no-empty-block
    - no-equal-then-else
    - prefer-const-declarations
    - prefer-final-fields
    - avoid-print

  # Excluimos archivos y métodos generados o estructurales para no generar falsas alertas
  exclude:
    - "**/*Model.dart"
    - "**/*Producto.dart"
    - "**/*.fromMap"
    - "**/*.toMap"
    - "**/*.copyWith"
    - "**/*.g.dart"
    - "**/*.freezed.dart"

# ==============================================
# ✅ REGLAS DE LINTER
# ==============================================
linter:
  rules:
    - avoid_print: error                    # Prohibir completamente el uso de print()
    - always_declare_return_types
    - always_use_package_imports
    - annotate_overrides
    - avoid_empty_else
    - avoid_unnecessary_containers
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - constant_identifier_names
    - depend_on_referenced_packages
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_in_if_null_operators
    - use_key_in_widget_constructors

# ==============================================
# ✅ CONFIGURACIÓN DEL ANALIZADOR
# ==============================================
analyzer:
  strong-mode:
    implicit-casts: false                  # Evitar conversiones de tipo implícitas
    implicit-dynamic: false               # Evitar el uso de tipo dinámico sin declaración
  errors:
    avoid_print: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    invalid_assignment: error
    deprecated_member_use: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
