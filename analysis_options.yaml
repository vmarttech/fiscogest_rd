include: package:flutter_lints/flutter.yaml

# ==============================================
# ✅ CONFIGURACIÓN DE DART CODE METRICS
# ==============================================
dart_code_metrics:
  metrics:
    cyclomatic-complexity: 15
    maximum-nesting-level: 4
    number-of-parameters: 6
    source-lines-of-code: 250

  rules:
    - avoid-unused-parameters
    - avoid-unnecessary-type-casts
    - no-empty-block
    - no-equal-then-else
    - prefer-const-declarations
    - prefer-final-fields
    - avoid-print

  # ✅ Excluimos métodos automáticos de los modelos
  exclude:
    - "**/*Model.dart"
    - "**/*Producto.dart"
    - "**/*.fromMap"
    - "**/*.copyWith"

# ==============================================
# ✅ PROHIBIR USO DE print()
# ==============================================
linter:
  rules:
    avoid_print: error

analyzer:
  errors:
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"